name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build_pack_publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore CJS.MudExtensions.sln

      - name: Build
        run: dotnet build CJS.MudExtensions.sln -c Release --no-restore

      - name: Pack
        run: dotnet pack src/CJS.MudExtensions/CJS.MudExtensions.csproj -c Release --no-build -o ./artifacts

      - name: Push (NuGet)
        if: github.event_name == 'push' && (github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/v'))
        run: dotnet nuget push "./artifacts/*.nupkg" --source "https://api.nuget.org/v3/index.json" --api-key "${{ secrets.NUGET_API_KEY }}"
